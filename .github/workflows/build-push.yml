name: build-push-deploy
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

env:
  VAULT_ADDR: https://vault.downops.win

concurrency:
  group: nn-portfolio-deploy
  cancel-in-progress: false

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s ci -p 'test_security_gate.py'
      - name: Build runtime image and generate resolved CycloneDX SBOM
        run: python3 ci/security_gate.py prepare
      - name: Enforce SonarQube quality gate and Dependency-Track vulnerability gate
        run: python3 ci/security_gate.py scan
      - uses: actions/upload-artifact@v4
        with:
          name: scanned-image-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            security-image.tar
            security-image.json
          if-no-files-found: error
          retention-days: 1

  build-push-deploy:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: scanned-image-${{ github.sha }}-${{ github.run_attempt }}
      - name: Verify and load the exact security-gated image
        run: python3 ci/security_gate.py reuse

      - name: Authenticate to Vault using GitHub OIDC
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          _vault_ci_opener = urllib.request.build_opener()
          _vault_ci_opener.addheaders = [("User-Agent", "DownOps-Vault-CI/1.0")]
          urllib.request.install_opener(_vault_ci_opener)
          token_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          token_url += ('&' if '?' in token_url else '?') + urllib.parse.urlencode({'audience': 'vault'})
          token_req = urllib.request.Request(
              token_url,
              headers={
                  'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'],
                  'User-Agent': 'Mozilla/5.0',
              })
          with urllib.request.urlopen(token_req, timeout=20) as response:
              jwt = json.load(response)['value']
          login_req = urllib.request.Request(
              os.environ['VAULT_ADDR'].rstrip('/') + '/v1/auth/github-actions/login',
              data=json.dumps({'role': 'nn-portfolio-ci', 'jwt': jwt}).encode(),
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'},
              method='POST')
          with urllib.request.urlopen(login_req, timeout=20) as response:
              vault_token = json.load(response)['auth']['client_token']
          print(f'::add-mask::{vault_token}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'VAULT_TOKEN={vault_token}\n')
          print('vault-oidc-login-ok')
          PY

      - name: Read Harbor credentials from Vault
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          _vault_ci_opener = urllib.request.build_opener()
          _vault_ci_opener.addheaders = [("User-Agent", "DownOps-Vault-CI/1.0")]
          urllib.request.install_opener(_vault_ci_opener)
          addr = os.environ['VAULT_ADDR'].rstrip('/')
          token = os.environ['VAULT_TOKEN']
          def read(path):
              req = urllib.request.Request(
                  f'{addr}/v1/{path}',
                  headers={'X-Vault-Token': token, 'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)['data']['data']
          robot = read('downops/data/services/harbor/ci/instance-003')
          urls = read('downops/data/services/harbor/urls')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('HARBOR_ROBOT_NAME', 'HARBOR_ROBOT_SECRET'):
                  print(f'::add-mask::{robot[key]}')
                  env.write(f'{key}={robot[key]}\n')
              registry = urls.get('HARBOR_PUBLIC_URL') or urls.get('HARBOR_API_URL')
              print(f'::add-mask::{registry}')
              env.write(f'HARBOR_URL={registry}\n')
          print('vault-read-ok')
          PY

      - name: Build and push versioned image
        run: |
          SHORT="${GITHUB_SHA::7}"
          VERSION="$(tr -d '\n' < VERSION)"
          TAG="${VERSION}-${SHORT}"
          IMAGE="${HARBOR_URL}/portfolio/nn-portfolio"
          echo "TAG=${TAG}" >>"$GITHUB_ENV"
          echo "$HARBOR_ROBOT_SECRET" | docker login "$HARBOR_URL" \
            -u "$HARBOR_ROBOT_NAME" --password-stdin
          docker tag security-target:ci "${IMAGE}:${TAG}"
          docker tag security-target:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Update ArgoCD image reference
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          manifest = pathlib.Path('k8s/app.yaml')
          text = manifest.read_text()
          image = 'registry.int.downops.win/noelnovo/nn-portfolio:' + os.environ['TAG']
          updated, count = re.subn(
              r'(?m)^(\s*image:\s*)registry\.int\.downops\.win/portfolio/nn-portfolio:\S+$',
              lambda match: match.group(1) + image,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('expected one portfolio image reference')
          manifest.write_text(updated)
          PY
          git config user.name 'nn-portfolio-ci'
          git config user.email 'nn-portfolio-ci@downops.win'
          git add k8s/app.yaml
          git commit -m "[skip ci] Deploy ${TAG}" && git push origin HEAD:main || echo 'manifest unchanged'
