name: build-push-deploy
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nn-portfolio-deploy
  cancel-in-progress: false

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Harbor credentials from Vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          test -n "$VAULT_ADDR" || { echo 'missing VAULT_ADDR repo secret'; exit 1; }
          test -n "$VAULT_TOKEN" || { echo 'missing VAULT_TOKEN repo secret'; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request
          addr = os.environ['VAULT_ADDR'].rstrip('/')
          token = os.environ['VAULT_TOKEN']
          def read(path):
              req = urllib.request.Request(
                  f'{addr}/v1/{path}',
                  headers={'X-Vault-Token': token, 'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)['data']['data']
          robot = read('downops/data/nn-portfolio')
          urls = read('downops/data/harbor.urls')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('HARBOR_ROBOT_NAME', 'HARBOR_ROBOT_SECRET'):
                  print(f'::add-mask::{robot[key]}')
                  env.write(f'{key}={robot[key]}\n')
              registry = urls.get('HARBOR_PUBLIC_URL') or urls.get('HARBOR_API_URL')
              print(f'::add-mask::{registry}')
              env.write(f'HARBOR_URL={registry}\n')
          print('vault-read-ok')
          PY

      - name: Build and push versioned image
        run: |
          SHORT="${GITHUB_SHA::7}"
          VERSION="$(tr -d '\n' < VERSION)"
          TAG="${VERSION}-${SHORT}"
          IMAGE="${HARBOR_URL}/portfolio/nn-portfolio"
          echo "TAG=${TAG}" >>"$GITHUB_ENV"
          echo "$HARBOR_ROBOT_SECRET" | docker login "$HARBOR_URL" \
            -u "$HARBOR_ROBOT_NAME" --password-stdin
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Update ArgoCD image reference
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          manifest = pathlib.Path('k8s/app.yaml')
          text = manifest.read_text()
          image = '10.2.0.101:5000/portfolio/nn-portfolio:' + os.environ['TAG']
          updated, count = re.subn(
              r'(?m)^(\s*image:\s*)10\.2\.0\.101:5000/portfolio/nn-portfolio:\S+$',
              lambda match: match.group(1) + image,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('expected one portfolio image reference')
          manifest.write_text(updated)
          PY
          git config user.name 'nn-portfolio-ci'
          git config user.email 'nn-portfolio-ci@downops.win'
          git add k8s/app.yaml
          git commit -m "[skip ci] Deploy ${TAG}" && git push origin HEAD:main || echo 'manifest unchanged'
